<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Survey Details</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-4">

<h3 class="mb-4">

🚜 New Field Survey

</h3>

<form action="{{ url_for('mobile.survey') }}">

<div class="mb-3">

<label class="form-label">

Survey Type

</label>

<select class="form-select"
        name="survey_type">

<option>New Main Field</option>

<option>New Sub-field</option>

<option>Update Existing Boundary</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">

Field Name

</label>

<input
class="form-control"
name="field">

</div>

<div class="mb-3">

<label class="form-label">

Parent Field

</label>

<input
class="form-control"
name="parent">

</div>

<div class="mb-3">

<label class="form-label">

Crop

</label>

<input
class="form-control"
name="crop">

</div>

<div class="mb-3">

<label class="form-label">

Soil

</label>

<input
class="form-control"
name="soil">

</div>

<div class="mb-3">

<label class="form-label">

Season

</label>

<input
class="form-control"
name="season"
value="2026/27">

</div>

<button
class="btn btn-success w-100">

Continue To GPS →

</button>

</form>

</div>

</body>

</html>
