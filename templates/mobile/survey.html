<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>DCGL FieldMate - Survey</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

html,
body{

    margin:0;
    padding:0;
    height:100%;
    background:#f8f9fa;

}

#map{

    height:55vh;
    width:100%;

}

.panel{

    padding:15px;

}

.status{

    font-weight:bold;
    color:#198754;

}

.gps-value{

    font-family:monospace;
    font-size:15px;

}

.card{

    border:none;

    border-radius:15px;

    box-shadow:0 2px 10px rgba(0,0,0,.12);

}

.dashboard-value{

    font-size:22px;

    font-weight:bold;

    color:#198754;

}

.dashboard-label{

    font-size:13px;

    color:#777;

}

</style>

</head>

<body>

<!-- ===================================================== -->
<!-- MAP -->
<!-- ===================================================== -->

<div id="map"></div>

<div class="container-fluid mt-3">

<!-- ===================================================== -->
<!-- GPS STATUS -->
<!-- ===================================================== -->

<div class="card mb-3">

<div class="card-header bg-success text-white">

<h5 class="mb-0">

📡 GPS Status

</h5>

</div>

<div class="card-body">

<div class="row">

<div class="col-md-6">

<p>

<b>Status:</b>

<span id="gpsStatus" class="status">

STOPPED

</span>

</p>

<p>

<b>Latitude:</b>

<span id="lat" class="gps-value">

-

</span>

</p>

<p>

<b>Longitude:</b>

<span id="lng" class="gps-value">

-

</span>

</p>

</div>

<div class="col-md-6">

<p>

<b>GPS Accuracy:</b>

<span id="accuracy" class="gps-value">

Waiting...

</span>

</p>

<p>

<b>GPS Quality:</b>

<span id="gpsQuality" class="gps-value">

Unknown

</span>

</p>

</div>

</div>

</div>

</div>

<!-- ===================================================== -->
<!-- LIVE SURVEY DASHBOARD -->
<!-- ===================================================== -->

<div class="card mb-3">

<div class="card-header bg-primary text-white">

<h5 class="mb-0">

📊 Live Survey Dashboard

</h5>

</div>

<div class="card-body">

<div class="row text-center">

<div class="col-6 col-md-3">

<div class="dashboard-value"

id="surveyArea">

0.000

</div>

<div class="dashboard-label">

Area (ha)

</div>

</div>

<div class="col-6 col-md-3">

<div class="dashboard-value"

id="surveyPerimeter">

0.0

</div>

<div class="dashboard-label">

Perimeter (m)

</div>

</div>

<div class="col-6 col-md-3 mt-3 mt-md-0">

<div class="dashboard-value"

id="surveyPoints">

0

</div>

<div class="dashboard-label">

GPS Points

</div>

</div>

<div class="col-6 col-md-3 mt-3 mt-md-0">

<div class="dashboard-value"

id="surveyDistance">

0.0

</div>

<div class="dashboard-label">

Distance (m)

</div>

</div>

</div>

<hr>

<div class="row text-center">

<div class="col-6 col-md-3">

<div class="dashboard-value"

id="surveyTime">

00:00:00

</div>

<div class="dashboard-label">

Elapsed Time

</div>

</div>

<div class="col-6 col-md-3">

<div class="dashboard-value"

id="currentAccuracy">

0.0

</div>

<div class="dashboard-label">

Current Accuracy (m)

</div>

</div>

<div class="col-6 col-md-3 mt-3 mt-md-0">

<div class="dashboard-value"

id="averageAccuracy">

0.0

</div>

<div class="dashboard-label">

Average Accuracy (m)

</div>

</div>

<div class="col-6 col-md-3 mt-3 mt-md-0">

<div class="dashboard-value"

id="gpsQualityStatus">

★★★★★

</div>

<div class="dashboard-label">

GPS Quality

</div>

</div>

</div>

</div>

</div>

<!-- ===================================================== -->
<!-- BUTTONS -->
<!-- ===================================================== -->

<div class="d-grid gap-2 mb-4">

<button

id="startGPS"

class="btn btn-success btn-lg">

📡 Start GPS

</button>

<button

id="startSurvey"

class="btn btn-primary btn-lg">

🚶 Start Survey

</button>

<button

id="finishSurvey"

class="btn btn-danger btn-lg">

✅ Finish Survey

</button>

</div>

</div>

<!-- ===================================================== -->
<!-- JAVASCRIPT -->
<!-- ===================================================== -->

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="{{ url_for('static', filename='mobile/js/gps_engine.js') }}"></script>

<script src="{{ url_for('static', filename='mobile/js/polygon.js') }}"></script>

<script src="{{ url_for('static', filename='mobile/js/area.js') }}"></script>

<script src="{{ url_for('static', filename='mobile/js/survey_ui.js') }}"></script>

<script src="{{ url_for('static', filename='mobile/js/survey_save.js') }}"></script>

<script src="{{ url_for('static', filename='mobile/js/survey_debug.js') }}"></script>

<script src="{{ url_for('static', filename='mobile/js/survey.js') }}"></script>

</body>

</html>
