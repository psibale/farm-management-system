<!DOCTYPE html>

<html>

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>DCGL Mobile Field Survey</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        html,
        body{

            margin:0;
            padding:0;
            height:100%;

        }

        #map{

            height:60vh;
            width:100%;

        }

        .panel{

            padding:15px;

        }

        .status{

            font-weight:bold;
            color:#198754;

        }

        .gps-value{

            font-family:monospace;
            font-size:15px;

        }

    </style>

</head>

<body>

<div id="map"></div>

<div class="panel">

    <h4>📍 DCGL Mobile Field Survey</h4>

    <hr>

    <p>

        <b>Status:</b>

        <span id="gpsStatus" class="status">

            STOPPED

        </span>

    </p>

    <p>

        <b>Accuracy:</b>

        <span id="accuracy" class="gps-value">

            Waiting...

        </span>

    </p>

    <p>

        <b>Latitude:</b>

        <span id="lat" class="gps-value">

            -

        </span>

    </p>

    <p>

        <b>Longitude:</b>

        <span id="lng" class="gps-value">

            -

        </span>

    </p>

    <p>

        <b>GPS Quality:</b>

        <span id="gpsQuality" class="gps-value">

            Unknown

        </span>

    </p>

    <hr>

    <h5>📐 Live Survey</h5>

    <p>

    Area:
    <strong>

    <span id="surveyArea">

    0.00

    </span>

    ha

    </strong>

    </p>

    <p>

    Perimeter:
    <strong>

    <span id="surveyPerimeter">

    0

    </span>

    m

    </strong>

    </p>

    <p>

    Boundary Points:
    <strong>

    <span id="surveyPoints">

    0

    </span>

    </strong>

    </p>

    <hr>

    <button
        id="startGPS"
        class="btn btn-success w-100">

        📡 Start GPS

    </button>

    <button
        id="startSurvey"
        class="btn btn-primary w-100 mt-2">

        🚶 Start Survey

    </button>

    <button
        id="finishSurvey"
        class="btn btn-danger w-100 mt-2">

        ✅ Finish Survey

    </button>

</div>

<!-- ============================= -->
<!-- JAVASCRIPT -->
<!-- ============================= -->

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- DCGL Mobile Survey -->
<script src="{{ url_for('static', filename='mobile/js/gps_engine.js') }}"></script>
<script src="{{ url_for('static', filename='mobile/js/polygon.js') }}"></script>
<script src="{{ url_for('static', filename='mobile/js/area.js') }}"></script>
<script src="{{ url_for('static', filename='mobile/js/survey.js') }}"></script>


</body>

</html>
