<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>DCGL Mobile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet">


<style>

body {
    background: #f5f7fa;
    font-family: Segoe UI, sans-serif;
}


/* =========================
   HEADER
========================= */

.header {

    background: #198754;

    color: white;

    padding: 25px;

    text-align: center;

    font-size: 24px;

    font-weight: bold;

    box-shadow: 0 3px 10px rgba(0,0,0,.2);

}


/* =========================
   MAIN CONTAINER
========================= */

.container {

    padding: 20px;

}


/* =========================
   USER PANEL
========================= */

.user-panel {

    background: white;

    border-radius: 15px;

    padding: 15px 18px;

    margin-bottom: 20px;

    box-shadow: 0 2px 8px rgba(0,0,0,.10);

}


.user-name {

    font-weight: 600;

    color: #198754;

    font-size: 16px;

}


.logout-btn {

    border-radius: 10px;

    font-weight: 600;

    padding: 9px 14px;

}


/* =========================
   MENU CARDS
========================= */

.menu-card {

    border: none;

    border-radius: 15px;

    margin-bottom: 15px;

    box-shadow: 0 2px 8px rgba(0,0,0,.12);

    transition: .2s;

}


.menu-card:hover {

    transform: translateY(-3px);

    box-shadow: 0 5px 15px rgba(0,0,0,.2);

}


.menu-card a {

    text-decoration: none;

    color: #222;

    display: block;

    padding: 20px;

    font-size: 18px;

    font-weight: 600;

}


.menu-card i {

    width: 35px;

    color: #198754;

}


/* =========================
   FOOTER
========================= */

.footer {

    text-align: center;

    color: #888;

    margin-top: 30px;

    font-size: 13px;

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    🌾 DCGL Mobile

</div>



<div class="container">


    <!-- =========================
         LOGGED-IN USER
    ========================= -->

    <div class="user-panel">

        <div class="d-flex
                    align-items-center
                    justify-content-between">

            <div>

                <small class="text-muted">
                    Logged in as
                </small>

                <div class="user-name">

                    <i class="fa-solid fa-user me-1"></i>

                    {{ session.get("username", "User") }}

                </div>

            </div>


            <!-- LOGOUT BUTTON -->

            <a href="{{ url_for('mobile.logout') }}"
               class="btn btn-outline-danger logout-btn">

                <i class="fa-solid fa-right-from-bracket me-1"></i>

                Logout

            </a>

        </div>

    </div>



    <!-- =========================
         NEW FIELD SURVEY
    ========================= -->

    <div class="card menu-card">

        <a href="{{ url_for('mobile.survey_details') }}">

            <i class="fa-solid fa-draw-polygon"></i>

            New Field Survey

        </a>

    </div>



    <!-- =========================
         CROP INSPECTION
    ========================= -->

    <div class="card menu-card">

        <a href="#">

            <i class="fa-solid fa-seedling"></i>

            Crop Inspection

            <span class="badge bg-secondary float-end">

                Soon

            </span>

        </a>

    </div>



    <!-- =========================
         IRRIGATION INSPECTION
    ========================= -->

    <div class="card menu-card">

        <a href="#">

            <i class="fa-solid fa-droplet"></i>

            Irrigation Inspection

            <span class="badge bg-secondary float-end">

                Soon

            </span>

        </a>

    </div>



    <!-- =========================
         PEST & DISEASE
    ========================= -->

    <div class="card menu-card">

        <a href="#">

            <i class="fa-solid fa-bug"></i>

            Pest & Disease Inspection

            <span class="badge bg-secondary float-end">

                Soon

            </span>

        </a>

    </div>



    <!-- =========================
         GEO-TAGGED PHOTOS
    ========================= -->

    <div class="card menu-card">

        <a href="#">

            <i class="fa-solid fa-camera"></i>

            Geo-tagged Photos

            <span class="badge bg-secondary float-end">

                Soon

            </span>

        </a>

    </div>



    <!-- =========================
         SYNCHRONIZE
    ========================= -->

    <div class="card menu-card">

        <a href="#">

            <i class="fa-solid fa-cloud-arrow-up"></i>

            Synchronize Data

            <span class="badge bg-secondary float-end">

                Soon

            </span>

        </a>

    </div>



    <!-- =========================
         FOOTER
    ========================= -->

    <div class="footer">

        DCGL Farm Management System

        <br>

        Mobile GIS v1.0

    </div>


</div>


</body>

</html>
