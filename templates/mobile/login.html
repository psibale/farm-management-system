<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#198754"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="DCGL FieldMate"
    >

    <!-- ================================================= -->
    <!-- PWA MANIFEST -->
    <!-- ================================================= -->

    <link
        rel="manifest"
        href="{{ url_for(
            'static',
            filename='mobile/manifest.json'
        ) }}"
    >

    <!-- ================================================= -->
    <!-- BOOTSTRAP -->
    <!-- ================================================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        html,
        body {

            height: 100%;
            margin: 0;

        }


        body {

            background:
                linear-gradient(
                    135deg,
                    #198754,
                    #0f5132
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .login-container {

            width: 100%;

            max-width: 420px;

        }


        .login-card {

            background: #ffffff;

            border: none;

            border-radius: 24px;

            padding: 30px 25px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, .25);

        }


        /* =================================================
           FIELDMATE ICON
        ================================================= */

        .fieldmate-icon {

            width: 90px;

            height: 90px;

            margin:
                0 auto 15px;

            border-radius: 22px;

            background: #198754;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 48px;

            box-shadow:
                0 8px 20px
                rgba(25, 135, 84, .3);

        }


        /* =================================================
           TITLE
        ================================================= */

        .fieldmate-title {

            font-weight: 700;

            color: #198754;

            text-align: center;

            margin-bottom: 3px;

        }


        .fieldmate-subtitle {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 25px;

        }


        /* =================================================
           FORM
        ================================================= */

        .form-control {

            border-radius: 12px;

            padding: 13px 15px;

        }


        .form-control:focus {

            border-color: #198754;

            box-shadow:
                0 0 0 .2rem
                rgba(25, 135, 84, .15);

        }


        /* =================================================
           LOGIN BUTTON
        ================================================= */

        .login-button {

            border-radius: 12px;

            padding: 13px;

            font-weight: 700;

            font-size: 17px;

        }


        /* =================================================
           FOOTER
        ================================================= */

        .footer-text {

            text-align: center;

            color: #777;

            font-size: 12px;

            margin-top: 20px;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 576px) {

            .login-card {

                padding:
                    25px 20px;

            }

            .fieldmate-icon {

                width: 80px;

                height: 80px;

                font-size: 42px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-card">


        <!-- ============================================= -->
        <!-- ICON -->
        <!-- ============================================= -->

        <div class="fieldmate-icon">

            📱

        </div>


        <!-- ============================================= -->
        <!-- TITLE -->
        <!-- ============================================= -->

        <h2 class="fieldmate-title">

            DCGL FieldMate

        </h2>


        <div class="fieldmate-subtitle">

            Mobile Field Survey System

        </div>


        <!-- ============================================= -->
        <!-- FLASH MESSAGES -->
        <!-- ============================================= -->

        {% with messages =
            get_flashed_messages(
                with_categories=true
            )
        %}

            {% if messages %}

                {% for category, message in messages %}

                    <div
                        class="alert alert-{{ category }}"
                        role="alert"
                    >

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- ============================================= -->
        <!-- LOGIN FORM -->
        <!-- ============================================= -->

        <form
            method="POST"
            action="{{ url_for('mobile.login') }}"
        >


            <!-- ========================================= -->
            <!-- NEXT DESTINATION -->
            <!-- ========================================= -->

            <input
                type="hidden"
                name="next"
                value="{{ next or '' }}"
            >


            <!-- ========================================= -->
            <!-- USERNAME -->
            <!-- ========================================= -->

            <div class="mb-3">

                <label
                    class="form-label fw-semibold"
                >

                    Username

                </label>


                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                    autofocus
                >

            </div>


            <!-- ========================================= -->
            <!-- PASSWORD -->
            <!-- ========================================= -->

            <div class="mb-4">

                <label
                    class="form-label fw-semibold"
                >

                    Password

                </label>


                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- ========================================= -->
            <!-- LOGIN BUTTON -->
            <!-- ========================================= -->

            <div class="d-grid">

                <button
                    type="submit"
                    class="btn btn-success login-button"
                >

                    📱 Open FieldMate

                </button>

            </div>


        </form>


        <!-- ============================================= -->
        <!-- FOOTER -->
        <!-- ============================================= -->

        <div class="footer-text">

            DCGL FieldMate

            <br>

            Offline-capable field surveying

        </div>


    </div>

</div>


</body>

</html>
